candidate_tools:
  - name: list_dol_datasets
    description: >-
      List the DOL Open Data Portal dataset catalogue, optionally filtered to a single
      agency. This is the only DOL v4 route that answers without an API key.
    backing_operation: GET https://apiprod.dol.gov/v4/datasets
    auth_required: false
    inputs:
      page:
        type: integer
        description: 1-based page number; the response carries meta.total_pages.
    derived_from: https://apiprod.dol.gov/v4/datasets (observed response, 2026-09-05)
  - name: get_ilab_dataset_metadata
    description: >-
      Return the variable-level metadata for one ILAB dataset, including allowed value
      ranges and the valueless-entry list.
    backing_operation: GET https://apiprod.dol.gov/v4/get/ilab/{endpoint}/{format}/metadata
    auth_required: true
    inputs:
      endpoint:
        type: string
        description: The dataset's api_url, e.g. LaborShield_Goods.
      format:
        type: string
        enum: [json, xml, csv]
    derived_from: https://dataportal.dol.gov/getting-started
  - name: query_ilab_dataset
    description: >-
      Query rows from one ILAB dataset with field selection, filtering, sorting and
      limit/offset paging.
    backing_operation: GET https://apiprod.dol.gov/v4/get/ilab/{endpoint}/{format}
    auth_required: true
    inputs:
      endpoint:
        type: string
      format:
        type: string
        enum: [json, xml, csv]
      limit:
        type: integer
        description: Max 10,000 records or 5 MB per request, whichever is hit first. Default 10.
      offset:
        type: integer
        description: Records to skip. Default 0.
      fields:
        type: string
        description: Comma-separated field names.
      sort:
        type: string
        enum: [asc, desc]
      sort_by:
        type: string
      filter_object:
        type: string
        description: >-
          JSON string with field / operator / value. Operators eq, neq, gt, lt, in,
          not_in, like.
    derived_from: https://dataportal.dol.gov/getting-started
candidate_tools_note: >-
  Input schemas are transcribed from the provider's published parameter reference. They
  are NOT read from an OpenAPI or from a live tools/list, because neither exists. Column
    names per dataset are unknown without an authenticated metadata call, so a real server
    would need one before it could validate `fields`, `sort_by` or `filter_object.field`.

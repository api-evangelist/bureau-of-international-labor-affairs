summary: >-
  NOBODY SHIPS AN MCP SERVER FOR THIS API. Neither ILAB nor the Department of Labor
  publishes one, hosted or local. What follows is a CANDIDATE tool list — what a server
  over ILAB's seven datasets would expose — and it must not be read as an agent surface
  that exists.

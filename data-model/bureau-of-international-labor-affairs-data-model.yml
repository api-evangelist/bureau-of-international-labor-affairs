    first_published: '2026-01-22'
  - name: ImportWatch
    datasets: ['10294', '10295', '10296']
    purpose: >-
      Joins ILAB's flagship-report findings to U.S. import trade data via Harmonized
      Tariff Schedule codes to surface high-risk imports.

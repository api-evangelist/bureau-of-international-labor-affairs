summary: >-
  ILAB publishes seven tabular datasets through the DOL v4 API. They are flat tables, not
  a linked resource graph — there are no $refs, no hypermedia links and no id-reference
  fields to walk, because there is no OpenAPI and the per-dataset /metadata route (which
  is where column-level structure lives) requires an API key. What IS observable
  anonymously is the catalogue record for each dataset, and the product families the
  bureau groups them into. Column-level fields are deliberately NOT listed here: they
  were not observed, and inventing them is the failure mode this pipeline exists to avoid.

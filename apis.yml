description: >-
  ILAB is the U.S. Department of Labor bureau that strengthens global labor standards, enforces labor
  commitments in trade agreements, promotes equity, and combats child labor, forced labor and human trafficking.
  ILAB operates no API of its own: its seven public datasets — the Child Labor Report and the ImportWatch
  and LaborShield families, all derived from ILAB's three flagship reports — are served through the department-wide
  DOL Open Data Portal API at apiprod.dol.gov/v4, under the agency segment 'ilab', with a free X-API-KEY
  credential.

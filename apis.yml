    type: Data Portal
  description: >-
    ILAB's datasets are served through the U.S. Department of Labor Open Data Portal API (https://apiprod.dol.gov/v4)
    under the agency segment 'ilab'. The catalogue route /v4/datasets answers anonymously; dataset rows
    and metadata require a free X-API-KEY. Seven ILAB datasets cover child labor, forced labor, goods
    produced by child or forced labor, and Harmonized Tariff Schedule matches to U.S. import trade data.
    The previously recorded base URL https://api.dol.gov/V1/ILAB is retired and now returns an AWS API
    Gateway route-not-found 403.
  features:
  - Child Labor Data
  - Forced Labor Data
  - Country Profiles
  - Trade Agreement Compliance
  useCases:
  - Research global labor standards violations
  - Track goods produced with child or forced labor
  - Monitor trade agreement labor commitments
  - Support CSR due diligence workflows
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/bureau-of-international-labor-affairs.png
- aid: >-
    bureau-of-international-labor-affairs:ilab-sweat-and-toil-data
  name: ILAB Sweat & Toil / LaborShield dataset family
  tags:

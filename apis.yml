    type: DeveloperPortal
  - url: data-model/bureau-of-international-labor-affairs-data-model.yml
    type: DataModel
  description: >-
    The Sweat & Toil programme's data now ships under the LaborShield, ImportWatch, SourcingStrong and
    SupplyChainTrace names. Seven tables are published through the DOL Open Data Portal API: Child_Labor_Report__2016_to_2022
    (whose table name still carries the sweat_toil prefix), ImportWatch_Core_Data, ImportWatch_Goods_HS,
    ImportWatch_Country_Codes, LaborShield_ReportingData, LaborShield_Goods and LaborShield_SuggestedActions.
    The former Sweat & Toil landing page at dol.gov/agencies/ilab/our-work/data-research/sweat-toil now
    returns 404.
  features:
  - Goods Produced by Child Labor
  - Goods Produced by Forced Labor
  - Country Advancement Level
  - Suggested Government Actions
  useCases:
  - Supply chain due diligence
  - ESG reporting
  - Academic research on child labor
  - Policy analysis

summary: >-
  ILAB publishes no client libraries of its own. The U.S. Department of Labor — the parent
  department that operates the API ILAB's datasets are served through — did once publish a
  family of first-party "DOL Data SDK" clients in nine languages. EVERY ONE OF THEM IS
  NOW ARCHIVED, none was ever published to a package registry, and all of them target the
  retired V1/V2 API on api.dol.gov rather than the current v4 API on apiprod.dol.gov.
  There is no maintained SDK for the API that actually serves ILAB data today.
finding: >-
